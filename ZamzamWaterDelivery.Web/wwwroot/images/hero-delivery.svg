<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Delivery van carrying water bottles">
  <defs>
    <linearGradient id="bottle" x1="0" x2="1">
      <stop offset="0" stop-color="#9ee3ff"/>
      <stop offset=".5" stop-color="#d9f4ff"/>
      <stop offset="1" stop-color="#7fd3fb"/>
    </linearGradient>
    <linearGradient id="van" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeaf8"/>
    </linearGradient>
  </defs>
  <ellipse cx="260" cy="350" rx="230" ry="22" fill="#0a2540" opacity=".18"/>
  <!-- Van body -->
  <rect x="40" y="140" width="290" height="180" rx="18" fill="url(#van)"/>
  <path d="M330 180h80l60 60v68a12 12 0 0 1-12 12H330z" fill="url(#van)"/>
  <path d="M345 195h58l45 45h-103z" fill="#9ec5fe"/>
  <rect x="40" y="270" width="430" height="14" fill="#0b5ed7"/>
  <text x="70" y="215" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b5ed7">ZAMZAM</text>
  <text x="72" y="245" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="500" fill="#0a3d8f">WATER DELIVERY</text>
  <path d="M250 175c0 0-18 22-18 34a18 18 0 0 0 36 0c0-12-18-34-18-34z" fill="#19b5fe"/>
  <!-- Wheels -->
  <circle cx="120" cy="320" r="34" fill="#0a2540"/><circle cx="120" cy="320" r="14" fill="#cfd8e3"/>
  <circle cx="390" cy="320" r="34" fill="#0a2540"/><circle cx="390" cy="320" r="14" fill="#cfd8e3"/>
  <!-- Bottles on roof -->
  <g transform="translate(70 40)">
    <rect x="0" y="20" width="62" height="80" rx="16" fill="url(#bottle)" stroke="#5bc4f5" stroke-width="2"/>
    <rect x="20" y="4" width="22" height="18" rx="4" fill="#0b5ed7"/>
    <rect x="8" y="45" width="46" height="4" rx="2" fill="#5bc4f5"/>
    <rect x="8" y="70" width="46" height="4" rx="2" fill="#5bc4f5"/>
  </g>
  <g transform="translate(145 40)">
    <rect x="0" y="20" width="62" height="80" rx="16" fill="url(#bottle)" stroke="#5bc4f5" stroke-width="2"/>
    <rect x="20" y="4" width="22" height="18" rx="4" fill="#0b5ed7"/>
    <rect x="8" y="45" width="46" height="4" rx="2" fill="#5bc4f5"/>
    <rect x="8" y="70" width="46" height="4" rx="2" fill="#5bc4f5"/>
  </g>
  <g transform="translate(220 40)">
    <rect x="0" y="20" width="62" height="80" rx="16" fill="url(#bottle)" stroke="#5bc4f5" stroke-width="2"/>
    <rect x="20" y="4" width="22" height="18" rx="4" fill="#0b5ed7"/>
    <rect x="8" y="45" width="46" height="4" rx="2" fill="#5bc4f5"/>
    <rect x="8" y="70" width="46" height="4" rx="2" fill="#5bc4f5"/>
  </g>
  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".7">
    <line x1="0" y1="180" x2="25" y2="180"/><line x1="5" y1="215" x2="28" y2="215"/><line x1="0" y1="250" x2="22" y2="250"/>
  </g>
</svg>
